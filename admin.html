<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA LMS — Admin Panel</title>
<link rel="stylesheet" href="admin.css?v=1">
<style>
  .panel{max-width:760px;margin:0 auto}
  .card2{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:.4px}
  input[type=text],input[type=password],input[type=url],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;outline:none}
  input:focus,textarea:focus{border-color:var(--gold)}
  textarea{min-height:110px;resize:vertical;font-family:inherit}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:14px}
  .del{background:#5a1f1f;color:#ffb4b4;border:1px solid #7a2d2d;padding:7px 12px;border-radius:8px;cursor:pointer}
  .note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:10px}
  h2{font-size:20px} h3{font-size:16px;margin-bottom:4px}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-badge">S</span><span class="brand-text">SIGMA <b>LMS</b><small>Admin Panel</small></span></a>
  <nav class="topnav"><a href="index.html">View Website</a></nav>
</header>

<main>
  <div class="panel" id="loginBox">
    <div class="card2">
      <h2>Admin Login</h2>
      <label>Username</label>
      <input type="text" id="un" placeholder="Enter username" autocomplete="username">
      <label>Password</label>
      <input type="password" id="pw" placeholder="Enter admin password" autocomplete="current-password">
      <div class="row"><button class="btn" id="loginBtn">Login</button></div>
      <p class="note" id="loginMsg"></p>
    </div>
  </div>

  <div class="panel" id="adminBox" style="display:none">
    <div class="card2">
      <h2>Add New Course</h2>
      <label>Course Title</label>
      <input type="text" id="cTitle" placeholder="e.g. Facebook Monetization Course">
      <label>Category</label>
      <input type="text" id="cCat" placeholder="e.g. Marketing">
      <label>Short Description</label>
      <input type="text" id="cDesc" placeholder="One line about the course">
      <label>Google Drive Folder Link (Open in Drive button ke liye)</label>
      <input type="url" id="cFolder" placeholder="https://drive.google.com/drive/folders/...">
      <label>Thumbnail Image URL (khali choro to default lagega)</label>
      <input type="url" id="cThumb" placeholder="https://...">
      <label>Lessons — har line mein: Lesson Title | Video Link (Drive file link ya direct video file link)</label>
      <textarea id="cLessons" placeholder="1. Pehla Lesson | https://drive.google.com/file/d/XXXX/view&#10;2. Dusra Lesson | https://drive.google.com/file/d/YYYY/view"></textarea>
      <div class="row">
        <button class="btn" id="addBtn">＋ Add Course</button>
        <button class="btn ghost" id="logoutBtn">Logout</button>
      </div>
      <p class="note" id="addMsg"></p>
      <p class="note">Note: Admin se added courses abhi is browser mein save hote hain. Sab visitors ke liye live karne ke liye neeche se Export karke file mujhe bhej dein, ya backend wala system lagne ke baad ye direct live hoga.</p>
    </div>

    <div class="card2">
      <h3>Your Added Courses</h3>
      <div id="customList"></div>
      <div class="row">
        <button class="btn ghost" id="exportBtn">Export JSON</button>
        <button class="btn ghost" id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>
  </div>
</main>

<script>
  const PW = 'Sigma@786';
  const UN = 'admin';
  const KEY = 'sigma-lms-custom';
  const $ = id => document.getElementById(id);

  function getCustom(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
  function setCustom(a){ localStorage.setItem(KEY, JSON.stringify(a)); }
  function driveId(link){ const m = String(link||'').match(/[-\w]{25,}/); return m ? m[0] : null; }
  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || ('course-' + Date.now()); }

  function renderList(){
    const list = getCustom();
    $('customList').innerHTML = list.length ? list.map((c,i)=>`
      <div class="item"><span><b>${c.title}</b> — ${c.lessons.length} lessons</span>
      <button class="del" data-i="${i}">Delete</button></div>`).join('')
      : '<p class="note">Abhi koi course add nahi hua.</p>';
    document.querySelectorAll('.del').forEach(b => b.addEventListener('click', ()=>{
      const a = getCustom(); a.splice(parseInt(b.dataset.i,10),1); setCustom(a); renderList();
    }));
  }

  $('loginBtn').addEventListener('click', ()=>{
    if($('un').value.trim() === UN && $('pw').value === PW){ sessionStorage.setItem('sigma-lms-admin','1'); showAdmin(); }
    else $('loginMsg').textContent = 'Wrong username or password.';
  });
  function showAdmin(){ $('loginBox').style.display='none'; $('adminBox').style.display='block'; renderList(); }
  if(sessionStorage.getItem('sigma-lms-admin')==='1') showAdmin();
  $('logoutBtn').addEventListener('click', ()=>{ sessionStorage.removeItem('sigma-lms-admin'); location.reload(); });

  $('addBtn').addEventListener('click', ()=>{
    const title = $('cTitle').value.trim();
    if(title.length < 4){ $('addMsg').textContent = 'Course title sahi se likhein.'; return; }
    const lessons = $('cLessons').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
      const parts = line.split('|');
      const t = (parts[0]||'Lesson').trim();
      const link = (parts[1]||'').trim();
      const id = driveId(link);
      if(id && link.includes('drive.google')) return { t, id };
      return { t, src: link };
    }).filter(l => l.id || l.src);
    if(!lessons.length){ $('addMsg').textContent = 'Kam az kam 1 lesson sahi link ke sath dein.'; return; }
    const course = {
      slug: slugify(title) + '-' + Date.now().toString(36),
      title,
      category: $('cCat').value.trim() || 'General',
      desc: $('cDesc').value.trim(),
      folder: $('cFolder').value.trim(),
      thumb: $('cThumb').value.trim() || 'assets/thumb-claude.jpg',
      lessons
    };
    const a = getCustom(); a.push(course); setCustom(a);
    $('addMsg').textContent = 'Course add ho gaya. Website par ja kar dekhein.';
    $('cTitle').value = $('cCat').value = $('cDesc').value = $('cFolder').value = $('cThumb').value = $('cLessons').value = '';
    renderList();
  });

  $('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(getCustom(), null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sigma-lms-courses.json'; a.click();
  });
  $('importBtn').addEventListener('click', ()=> $('importFile').click());
  $('importFile').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try { const data = JSON.parse(r.result); if(Array.isArray(data)){ setCustom(data); renderList(); alert('Import ho gaya.'); } } catch(err){ alert('File sahi nahi hai.'); } };
    r.readAsText(f);
  });
</script>
</body>
</html>
